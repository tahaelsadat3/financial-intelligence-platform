version: '3.8'

services:
  # 1. Multi-Tenant PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: fip_postgres_db
    restart: always
    environment:
      POSTGRES_DB: financial_platform_db
      POSTGRES_USER: fip_admin
      POSTGRES_PASSWORD: fip_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fip_admin -d financial_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Financial Intelligence Platform API & Engine Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fip_api_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fip_admin:fip_secure_password_2026@db:5432/financial_platform_db
      - ODOO_URL=https://demo.odoo.com
      - ODOO_DB=demo_db
      - ODOO_USER=admin
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
